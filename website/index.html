<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var host = location.hostname.toLowerCase()
        var isProd =
          host === 'tebpestcontrol.com' ||
          host === 'www.tebpestcontrol.com'
        if (!isProd) return
        var needHttps = location.protocol !== 'https:'
        var needApex = host === 'www.tebpestcontrol.com'
        if (needHttps || needApex) {
          location.replace(
            'https://tebpestcontrol.com' +
              location.pathname +
              location.search +
              location.hash,
          )
        }
      })()
    </script>
