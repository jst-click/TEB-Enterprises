# TEB pest control — force HTTPS + non-www
# Put this on the server (or adapt for your panel) so these all land on apex HTTPS:
#   https://www.tebpestcontrol.com  →  https://tebpestcontrol.com
#   http://www.tebpestcontrol.com   →  https://tebpestcontrol.com
#   http://tebpestcontrol.com       →  https://tebpestcontrol.com

server {
    listen 80;
    listen [::]:80;
    server_name tebpestcontrol.com www.tebpestcontrol.com;
    return 301 https://tebpestcontrol.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tebpestcontrol.com;

    # ssl_certificate     /etc/letsencrypt/live/tebpestcontrol.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tebpestcontrol.com/privkey.pem;

    return 301 https://tebpestcontrol.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tebpestcontrol.com;

    # ssl_certificate     /etc/letsencrypt/live/tebpestcontrol.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tebpestcontrol.com/privkey.pem;

    root /var/www/tebpestcontrol/website;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Dynamic SEO from API. If API is down, serve static file so GSC never gets 5xx.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8001/sitemap.xml;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @sitemap_static;
    }
    location @sitemap_static {
        # Adjust if your built site root differs (e.g. /var/www/TEB-Enterprises/website/dist)
        try_files /sitemap.xml =404;
        default_type application/xml;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:8001/robots.txt;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @robots_static;
    }
    location @robots_static {
        try_files /robots.txt =404;
        default_type text/plain;
    }
    location = /robot.txt {
        proxy_pass http://127.0.0.1:8001/robot.txt;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @robots_static;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
